name: Build and publish release binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
        shell: bash

      - name: Run tests
        run: python -m pytest -q
        shell: bash

      - name: Lint
        run: ruff check .
        shell: bash

      - name: Check tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(python -c 'import tomllib; d=tomllib.load(open("pyproject.toml","rb")); print(d["project"]["version"])')"
          INIT_VER="$(python -c 'import llmr; print(llmr.__version__)')"
          echo "Tag: $TAG, pyproject: $EXPECTED, llmr.__version__: $INIT_VER"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "ERROR: tag $TAG does not match pyproject.toml version $EXPECTED"
            exit 1
          fi
          if [ "v$INIT_VER" != "$EXPECTED" ]; then
            echo "ERROR: llmr.__version__ $INIT_VER does not match pyproject.toml version ${EXPECTED#v}"
            exit 1
          fi

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pyinstaller
          pip install -e ".[gui]"
        shell: bash

      - name: Build wheel and sdist
        if: runner.os == 'Linux'
        run: python -m build --sdist --wheel
        shell: bash

      - name: Build GUI binary
        run: |
          mkdir -p release
          pyinstaller --onefile --name llm-r-gui-${{ runner.os }} gui/pyqt_app.py --distpath release --workpath build/pyinstaller
        shell: bash

      - name: Build server binary
        run: |
          mkdir -p release
          pyinstaller --onefile --name llm-r-server-${{ runner.os }} backend/main.py --distpath release --workpath build/pyinstaller
        shell: bash

      - name: List artifacts
        run: |
          echo "dist contents:"
          ls -la dist || true
          echo "release contents:"
          ls -la release || true
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist
            release

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: List downloaded artifacts
        run: find downloaded -type f | sort

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: downloaded/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
