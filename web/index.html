<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM-r Command Surface</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #11151d;
      --panel-2: #151b25;
      --field: #080b10;
      --border: #2a3340;
      --text: #eef2f7;
      --muted: #9aa6b8;
      --blue: #62a0ff;
      --green: #7de2a0;
      --amber: #ffd28a;
      --red: #ff8fa0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 18px; }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0 18px;
    }
    h1 { font-size: 22px; margin: 0 10px 0 0; letter-spacing: 0; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    .spacer { flex: 1; }
    .chip {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 9px;
      color: var(--muted);
      background: #10141c;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .chip.ok { color: var(--green); border-color: #1f7a46; background: #10251c; }
    .chip.warn { color: var(--amber); border-color: #8a611d; background: #2d2110; }
    .chip.info { color: #a9c9ff; border-color: #2f64aa; background: #102039; }
    .shell {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 14px;
      align-items: start;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    textarea, pre {
      width: 100%;
      background: var(--field);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      font: inherit;
    }
    textarea { min-height: 210px; resize: vertical; line-height: 1.45; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 360px;
      overflow: auto;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }
    button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #1b2230;
      color: var(--text);
      font-weight: 800;
      padding: 9px 13px;
      cursor: pointer;
    }
    button.primary { background: #2f7cf6; border-color: #2f7cf6; color: white; }
    button:hover { border-color: var(--blue); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 7px; align-items: center; }
    .row { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .muted { color: var(--muted); font-size: 12px; }
    .board { display: grid; gap: 10px; }
    .action-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .action-card header { padding: 0 0 8px; }
    .tool { font-weight: 850; }
    .args { margin-top: 8px; color: var(--muted); font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { padding: 7px 10px; color: var(--muted); }
    .tabs button.active { color: var(--text); border-color: var(--blue); background: #102039; }
    .hidden { display: none; }
    .error { color: var(--red); }
    @media (max-width: 820px) {
      main { padding: 12px; }
      header { align-items: flex-start; flex-wrap: wrap; }
      .shell { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>LLM-r</h1>
      <span id="apiChip" class="chip">API checking</span>
      <span id="bridgeChip" class="chip">Bridge unknown</span>
      <span id="replyChip" class="chip">OSC replies unknown</span>
      <span class="spacer"></span>
      <span id="planChip" class="chip">No plan</span>
    </header>

    <div class="shell">
      <section>
        <h2>Command</h2>
        <textarea id="prompt" maxlength="2000" placeholder="Create a 2-bar jazzy drum loop, load Drum Rack, and start playback."></textarea>
        <div class="muted"><span id="charCount">0</span> / 2000</div>
        <div class="row">
          <button id="planBtn" class="primary">Plan</button>
          <button id="execBtn" disabled>Execute</button>
          <label><input type="checkbox" id="dry" checked /> Dry run</label>
          <label><input type="checkbox" id="autoApprove" /> Auto-approve</label>
          <label><input type="checkbox" id="approve" /> Destructive OK</label>
        </div>
        <p class="muted">Auto-approve executes immediately after planning. With Dry run enabled it only previews.</p>
      </section>

      <section>
        <div class="tabs">
          <button id="planTab" class="active">Plan Board</button>
          <button id="runTab">Run Log</button>
          <button id="detailsTab">Details</button>
        </div>
        <div id="planView" class="board">
          <div class="action-card">
            <header><span class="tool">No plan yet</span></header>
            <div class="muted">Enter a command and click Plan.</div>
          </div>
        </div>
        <div id="runView" class="board hidden"></div>
        <pre id="detailsView" class="hidden">(waiting)</pre>
      </section>
    </div>
  </main>

  <script>
    let currentPlanId = null;
    let currentPlan = null;
    const promptEl = document.getElementById('prompt');
    const planBtn = document.getElementById('planBtn');
    const execBtn = document.getElementById('execBtn');
    const planView = document.getElementById('planView');
    const runView = document.getElementById('runView');
    const detailsView = document.getElementById('detailsView');

    function setChip(id, text, tone = '') {
      const el = document.getElementById(id);
      el.className = `chip ${tone}`.trim();
      el.textContent = text;
    }

    function showTab(name) {
      for (const id of ['plan', 'run', 'details']) {
        document.getElementById(`${id}Tab`).classList.toggle('active', id === name);
        document.getElementById(`${id}View`).classList.toggle('hidden', id !== name);
      }
    }

    async function apiFetch(path, options) {
      const r = await fetch(path, options);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const msg = data?.error?.message || data?.detail || r.statusText;
        throw new Error(`${r.status} ${msg}`);
      }
      return data;
    }

    function renderPlan(data) {
      const actions = data.planned_actions || [];
      setChip('planChip', actions.length ? `${actions.length} action(s)` : 'No actions', actions.length ? 'ok' : 'warn');
      currentPlanId = data.plan_id || null;
      currentPlan = data;
      execBtn.disabled = !currentPlanId || actions.length === 0;
      planView.innerHTML = actions.length ? actions.map((action, index) => {
        const destructive = action.destructive ? "<span class='chip warn'>destructive</span>" : "<span class='chip ok'>safe</span>";
        const transport = action.transport || (action.address ? 'osc' : 'local');
        return `<div class="action-card">
          <header><span class="tool">${index + 1}. ${escapeHtml(action.tool || 'action')}</span>${destructive}<span class="chip info">${escapeHtml(transport)}</span></header>
          <div>${escapeHtml(action.description || '')}</div>
          <div class="args">${escapeHtml(JSON.stringify(action.args || [], null, 2))}</div>
        </div>`;
      }).join('') : `<div class="action-card"><span class="error">No executable actions.</span></div>`;
      detailsView.textContent = JSON.stringify(data, null, 2);
      showTab('plan');
    }

    function renderRun(data) {
      const rows = data.execution_report || [];
      runView.innerHTML = rows.length ? rows.map((row, index) => `
        <div class="action-card">
          <header><span class="tool">${index + 1}. ${escapeHtml(row.tool || 'action')}</span><span class="chip ${row.status === 'sent' || row.status === 'dry_run' ? 'ok' : 'warn'}">${escapeHtml(row.status || 'ok')}</span></header>
          <div class="args">${escapeHtml(JSON.stringify(row.args || [], null, 2))}</div>
          ${row.error ? `<div class="error">${escapeHtml(row.error)}</div>` : ''}
        </div>`).join('') : `<div class="action-card">No execution rows.</div>`;
      detailsView.textContent = JSON.stringify(data, null, 2);
      showTab('run');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
      }[ch]));
    }

    async function refreshHealth() {
      try {
        const health = await apiFetch('/health');
        setChip('apiChip', `API ${health.version || 'ok'}`, 'ok');
      } catch (err) {
        setChip('apiChip', 'API offline', 'warn');
      }
      try {
        const bridge = await apiFetch('/api/device-bridge/status');
        setChip('bridgeChip', bridge.ok ? 'Bridge reachable' : 'Bridge offline', bridge.ok ? 'ok' : 'warn');
      } catch (err) {
        setChip('bridgeChip', 'Bridge unknown', 'warn');
      }
      try {
        const replies = await apiFetch('/api/osc-replies/status');
        setChip('replyChip', replies.listening ? 'OSC replies on' : 'OSC replies off', replies.listening ? 'ok' : 'warn');
      } catch (err) {
        setChip('replyChip', 'OSC replies unknown', 'warn');
      }
    }

    async function plan() {
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      planBtn.disabled = true;
      setChip('planChip', 'Planning', 'info');
      try {
        const data = await apiFetch('/api/plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        renderPlan(data);
        if (document.getElementById('autoApprove').checked && currentPlanId) {
          await execute();
        }
      } catch (err) {
        planView.innerHTML = `<div class="action-card"><span class="error">Plan failed: ${escapeHtml(err.message)}</span></div>`;
        setChip('planChip', 'Plan failed', 'warn');
      } finally {
        planBtn.disabled = false;
      }
    }

    async function execute() {
      if (!currentPlanId) return;
      execBtn.disabled = true;
      setChip('planChip', 'Executing', 'info');
      try {
        const data = await apiFetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            plan_id: currentPlanId,
            approved: document.getElementById('approve').checked || document.getElementById('dry').checked,
            dry_run: document.getElementById('dry').checked,
          }),
        });
        renderRun(data);
        setChip('planChip', data.dry_run ? 'Dry run complete' : 'Executed', 'ok');
      } catch (err) {
        runView.innerHTML = `<div class="action-card"><span class="error">Execute failed: ${escapeHtml(err.message)}</span></div>`;
        detailsView.textContent = err.message;
        showTab('run');
        setChip('planChip', 'Execution failed', 'warn');
      } finally {
        execBtn.disabled = !currentPlanId;
      }
    }

    promptEl.addEventListener('input', () => {
      document.getElementById('charCount').textContent = promptEl.value.length;
    });
    planBtn.addEventListener('click', plan);
    execBtn.addEventListener('click', execute);
    document.getElementById('planTab').addEventListener('click', () => showTab('plan'));
    document.getElementById('runTab').addEventListener('click', () => showTab('run'));
    document.getElementById('detailsTab').addEventListener('click', () => showTab('details'));
    refreshHealth();
  </script>
</body>
</html>
